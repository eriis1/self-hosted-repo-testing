name: Deploy to Ganymede

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to publish the flows into'
                required: true
                type: choice
                options:
                - dev
                - prod
                default: dev
            authorEmail:
                description: 'Email of the author for the commit that is a Ganymede user'
                required: true

# Serialize deploys per environment so two runs can't race on the recorded-HEAD
# write-back below.
concurrency:
    group: deploy-ganymede-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment || 'dev' }}
        permissions:
            contents: write
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Read Ganymede HEAD SHA
            id: read-sha
            run: |
              SHA_FILE=".ganymede-sha-${{ inputs.environment }}"
              if [ -f "$SHA_FILE" ]; then
                echo "BASE_SHA=$(cat "$SHA_FILE")" >> $GITHUB_OUTPUT
              else
                echo "Error: $SHA_FILE not found. Run the Pull from Ganymede workflow first."
                exit 1
              fi

          - name: Commit to Ganymede
            id: ganymede-commit
            uses: ganymede-bio/flow-commit-action@fix/PORT-1714-deploy-sha-writeback
            with:
                environment: ${{ inputs.environment }}
                ganymede_environment: ${{ vars.GANYMEDE_ENVIRONMENT }}
                ganymede_subdomain: ${{ vars.GANYMEDE_SUBDOMAIN }}
                ganymede_api_token: ${{ secrets.GANYMEDE_API_TOKEN }}
                author_email: ${{ inputs.authorEmail }}
                base_sha: ${{ steps.read-sha.outputs.BASE_SHA }}

          # A successful commit advances Ganymede's HEAD, so the SHA recorded in
          # this repo is now stale. Without this step the next deploy sends the
          # old base_sha and is rejected with a 409 until someone runs a pull and
          # merges the sync PR.
          - name: Record new Ganymede HEAD SHA
            if: steps.ganymede-commit.outputs.commit-sha != ''
            env:
                COMMIT_SHA: ${{ steps.ganymede-commit.outputs.commit-sha }}
                DEPLOY_ENV: ${{ inputs.environment }}
            run: |
              # The SHA is interpolated into a commit message, so validate it is
              # a git object SHA and nothing else.
              if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{7,64}$'; then
                echo "Error: commit-sha is not a valid git SHA."
                exit 1
              fi

              SHA_FILE=".ganymede-sha-$DEPLOY_ENV"
              printf '%s\n' "$COMMIT_SHA" > "$SHA_FILE"

              if git diff --quiet -- "$SHA_FILE"; then
                echo "Recorded HEAD already up to date."
                exit 0
              fi

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$SHA_FILE"
              git commit -m "chore: record Ganymede HEAD $COMMIT_SHA for $DEPLOY_ENV"
              git push origin "HEAD:$GITHUB_REF_NAME"
